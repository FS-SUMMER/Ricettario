<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricettario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F5F2;--card:#fff;--ink:#18271F;--mute:#5A6B62;--line:#D5DFD8;--acc:#0F5F55;--acc-ink:#fff;--hl:#E9A820;--danger:#B3382C;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A16;--card:#17251F;--ink:#E6EFE9;--mute:#9DB0A5;--line:#2A3C34;--acc:#4FC3B0;--acc-ink:#07201B;--danger:#F08A7E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A16;--card:#17251F;--ink:#E6EFE9;--mute:#9DB0A5;--line:#2A3C34;--acc:#4FC3B0;--acc-ink:#07201B;--danger:#F08A7E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:700}h2{font-size:1.5rem;font-weight:700}h3{font-size:1.1rem;font-weight:500;margin:22px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:500}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.d{color:var(--danger)}
button.l{border:0;background:none;color:var(--acc);padding:6px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.rc{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border-radius:14px}
.rc b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;font-weight:700;display:block}
.mute{color:var(--mute);font-size:.9rem}
.stepper{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:4px 6px;background:var(--card)}
.stepper button{width:38px;height:38px;padding:0;font-size:1.3rem}
.stepper b{min-width:2ch;text-align:center;font-size:1.2rem}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.nut div{background:var(--bg);border-radius:10px;padding:10px 4px}
.nut b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.nut .k{border-bottom:3px solid var(--hl)}
ol.st{padding-left:1.3rem}ol.st li{margin:0 0 12px;padding-left:4px}
.er{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--card)}
.g{display:grid;gap:6px}.g3{grid-template-columns:2fr 1fr 1.2fr auto}.g5{grid-template-columns:repeat(5,1fr)}
.g5 label,.fl{font-size:.75rem;color:var(--mute)}
.cook{min-height:70vh;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.cook .big{font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;line-height:1.3;font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tm{font-size:2.4rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.warn{color:var(--danger);font-size:.85rem}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}.g3 input:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#msg{min-height:1.4em;margin-bottom:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<main><div id="msg" role="status"></div><div id="app"></div></main>
<datalist id="dl"></datalist>
<script>
const SB_URL="https://pwirmxhkxbwvzlgstwjw.supabase.co",SB_KEY="sb_publishable_sNL8Cy8cyplaqLIJC2YMnw_t-_iwiiv";
const sb=supabase.createClient(SB_URL,SB_KEY);
const DB={"pasta":[350,12,72,1.5,0],"farina":[340,10,76,1,0],"riso":[350,7,78,.6,0],"pomodori pelati":[20,1.2,3.5,.2,0],"olio extravergine":[899,0,0,99.9,0],"cipolla":[40,1.1,9,.1,110],"aglio":[130,6,30,.5,4],"uova":[143,12.5,.7,9.9,60],"latte":[46,3.3,4.9,1.5,0],"burro":[750,.8,.1,83,0],"zucchero":[392,0,100,0,0],"parmigiano":[392,36,0,28,0],"sale":[0,0,0,0,0],"patate":[77,2,17,.1,150],"petto di pollo":[110,23,0,1.5,0],"mozzarella":[253,18,.7,19,125],"basilico":[23,3,2.7,.6,0],"carote":[41,.9,10,.2,80],"pane":[270,9,55,2,0],"zucchine":[17,1.2,3,.3,200]};
const UN={g:1,ml:1,cucchiaio:15,cucchiaino:5},PORT=["Antipasto","Primo","Secondo","Contorno","Dolce","Altro"];
let U=null,CB=[],C=null,R=[],KN={},OFF={},view="login",cur=null,sc=4,draft=null,tm={id:null,left:0},q="",fc="Tutte",cs=0,needPw=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>{n=+n;return n>=10?String(Math.round(n)):String(Math.round(n*10)/10).replace(".",",")};
const LK=n=>DB[n.toLowerCase()]||KN[n.toLowerCase()];
const can=()=>C&&C.role!=="reader";
const msg=(t,ok)=>{const e=$("#msg");e.className=ok?"mute":"warn";e.textContent=t||""};
const fail=e=>{msg("Errore: "+(e.message||e));console.error(e)};
function grams(i){const q=+i.q||0;return i.u==="pezzo"?q*(+i.pc||0):q*(UN[i.u]||1)}
function nutri(r){const t={k:0,p:0,c:0,f:0};r.ings.forEach(i=>{const g=grams(i)/100;t.k+=g*i.k;t.p+=g*i.p;t.c+=g*i.c;t.f+=g*i.f});const s=r.servings||1;return{k:t.k/s,p:t.p/s,c:t.c/s,f:t.f/s}}
const fromDb=r=>({id:r.id,name:r.name,cat:r.category,servings:r.servings,
ings:[...r.recipe_ingredients].sort((a,b)=>a.position-b.position).map(i=>({n:i.name,q:+i.quantity,u:i.unit,k:+i.kcal,p:+i.protein,c:+i.carbs,f:+i.fat,pc:+i.piece_grams})),
steps:[...r.recipe_steps].sort((a,b)=>a.position-b.position).map(s=>({t:s.body,m:s.minutes}))});
/* ---------- avvio e accesso ---------- */
async function init(){if(/type=(invite|recovery)/.test(location.hash))needPw=true;
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")needPw=true});
const{data}=await sb.auth.getSession();U=data.session?.user||null;
if(!U){view="login";return render()}
if(needPw){view="pw";return render()}
loadCbs()}
async function login(){msg("Accesso…",1);const{data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
if(error)return msg("Email o password non corretti.");U=data.user;msg("");loadCbs()}
async function reset(){const e=$("#em").value.trim();if(!e)return msg("Scrivi prima la tua email.");
const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});error?fail(error):msg("Ti ho inviato un’email per scegliere una nuova password.",1)}
async function setPw(){const p=$("#np").value;if(p.length<8)return msg("La password deve avere almeno 8 caratteri.");
const{error}=await sb.auth.updateUser({password:p});if(error)return fail(error);
needPw=false;history.replaceState(null,"",location.pathname);msg("");const{data}=await sb.auth.getUser();U=data.user;loadCbs()}
async function out(){await sb.auth.signOut();U=null;CB=[];C=null;view="login";render()}
async function loadCbs(){msg("Carico…",1);
const{data,error}=await sb.from("cookbook_members").select("role,cookbooks(id,name)").eq("user_id",U.id);if(error)return fail(error);msg("");
CB=data.filter(m=>m.cookbooks).map(m=>({id:m.cookbooks.id,name:m.cookbooks.name,role:m.role}));
if(!CB.length){view="newcb";return render()}
let last=null;try{last=localStorage.getItem("cb")}catch(e){}
openCb((CB.find(c=>c.id===last)||CB[0]).id)}
async function openCb(id){C=CB.find(c=>c.id===id);try{localStorage.setItem("cb",id)}catch(e){}
if(await loadRecipes())go("list")}
async function loadRecipes(){msg("Carico le ricette…",1);
const[r,k]=await Promise.all([sb.from("recipes").select("*,recipe_ingredients(*),recipe_steps(*)").eq("cookbook_id",C.id).order("name"),sb.from("known_ingredients").select("*").eq("cookbook_id",C.id)]);
if(r.error||k.error){fail(r.error||k.error);return false}msg("");
R=r.data.map(fromDb);KN={};k.data.forEach(x=>KN[x.name.toLowerCase()]=[x.kcal,x.protein,x.carbs,x.fat,x.piece_grams].map(Number));return true}
async function newCb(){const n=$("#cn").value.trim();if(!n)return msg("Dai un nome al ricettario.");
const{error}=await sb.from("cookbooks").insert({name:n});if(error)return fail(error);loadCbs()}
async function addMember(){const e=$("#me").value.trim();if(!e)return msg("Scrivi l’email della persona.");
const{error}=await sb.rpc("add_member_by_email",{cb:C.id,member_email:e,member_role:$("#mr").value});
error?fail(error):msg("Fatto: "+e+" ora vede questo ricettario.",1)}
/* ---------- navigazione ---------- */
function go(v,id){view=v;if(id!==undefined){cur=id;const r=R.find(x=>x.id===id);if(r)sc=r.servings}clearInterval(tm.id);tm={id:null,left:0};msg("");render();window.scrollTo(0,0)}
function render(){$("#dl").innerHTML=Object.keys({...DB,...KN}).map(k=>`<option value="${esc(k)}">`).join("");
({login:vLogin,pw:vPw,newcb:vNew,list:vList,view:vView,edit:vEdit,cook:vCook,mem:vMem})[view]()}
function vLogin(){$("#app").innerHTML=`<h1>Ricettario</h1><p class="mute">Accedi con l’email con cui sei stato invitato.</p><div class="card g">
<input id="em" type="email" autocomplete="username" placeholder="Email"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
<button class="p" onclick="login()">Accedi</button><button class="l" onclick="reset()">Password dimenticata o primo accesso?</button></div>`}
function vPw(){$("#app").innerHTML=`<h1>Scegli una password</h1><div class="card g"><input id="np" type="password" autocomplete="new-password" placeholder="Nuova password (almeno 8 caratteri)" onkeydown="if(event.key==='Enter')setPw()"><button class="p" onclick="setPw()">Salva e continua</button></div>`}
function vNew(){$("#app").innerHTML=`<h2>Crea un ricettario</h2><p class="mute">Potrai poi invitare altre persone a condividerlo.</p><div class="card g"><input id="cn" placeholder="Es. Ricette di famiglia"><button class="p" onclick="newCb()">Crea</button>${CB.length?`<button onclick="go('list')">Annulla</button>`:`<button class="l" onclick="out()">Esci</button>`}</div>`}
function vMem(){$("#app").innerHTML=`<button class="l" onclick="go('list')">Indietro</button><h2>Condividi “${esc(C.name)}”</h2>`+(C.role==="owner"?`<p class="mute">1. In Supabase, vai su Authentication → Users → Invite user e invita la persona.<br>2. Scrivi qui la stessa email e scegli il ruolo.</p><div class="card g"><input id="me" type="email" placeholder="Email della persona"><select id="mr"><option value="editor">Può modificare</option><option value="reader">Può solo leggere</option></select><button class="p" onclick="addMember()">Aggiungi al ricettario</button></div>`:`<p class="mute">Solo il proprietario può aggiungere persone.</p>`)}
/* ---------- elenco ---------- */
function vList(){$("#app").innerHTML=`<div class="row sp"><h1>${esc(C.name)}</h1>${can()?`<button class="p" onclick="newR()">Nuova ricetta</button>`:""}</div>
<input id="q" type="search" value="${esc(q)}" placeholder="Cerca per nome o ingrediente, es. zucca" oninput="q=this.value;fillList()"><div class="row" id="ch" style="margin:10px 0"></div><div id="rl"></div>
<div class="row" style="margin-top:18px">${CB.length>1?`<select style="width:auto" onchange="openCb(this.value)">${CB.map(c=>`<option value="${c.id}" ${c.id===C.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`:""}<button class="l" onclick="go('mem')">Condividi</button><button class="l" onclick="go('newcb')">Nuovo ricettario</button><button class="l" onclick="out()">Esci</button></div>`;fillList()}
function fillList(){const t=q.trim().toLowerCase();
$("#ch").innerHTML=["Tutte",...PORT].map(c=>`<button class="${c===fc?"p":""}" onclick="fc='${c}';fillList()">${c}</button>`).join("");
const L=R.filter(r=>(fc==="Tutte"||r.cat===fc)&&(!t||r.name.toLowerCase().includes(t)||r.ings.some(i=>i.n.toLowerCase().includes(t))));
$("#rl").innerHTML=L.length?L.map(r=>{const m=t?r.ings.filter(i=>i.n.toLowerCase().includes(t)).map(i=>i.n):[];return`<button class="rc" onclick="go('view','${r.id}')"><b>${esc(r.name)}</b><span class="mute">${r.cat}, ${r.servings} porzioni, ${fmt(nutri(r).k)} kcal a persona</span>${m.length?`<span class="mute"> Contiene: ${esc(m.join(", "))}</span>`:""}</button>`}).join(""):`<p class="mute">Nessuna ricetta trovata.</p>`}
/* ---------- dettaglio e cucina ---------- */
function vView(){const r=R.find(x=>x.id===cur);if(!r)return go("list");const n=nutri(r),f=sc/r.servings;let miss=false;
const li=r.ings.map(i=>{if(i.u==="pezzo"&&!i.pc||!(i.k||i.p||i.c||i.f)&&i.n.toLowerCase()!=="sale")miss=true;return`<li><span>${esc(i.n)}</span><b>${fmt(i.q*f)} ${i.u==="pezzo"?(i.q*f===1?"pezzo":"pezzi"):i.u}</b></li>`}).join("");
$("#app").innerHTML=`<button class="l" onclick="go('list')">Tutte le ricette</button><h2>${esc(r.name)}</h2><span class="mute">${r.cat}</span>
<div class="row sp" style="margin:14px 0"><span>Per quante persone?</span><div class="stepper"><button aria-label="Meno" onclick="sc=Math.max(1,sc-1);render()">−</button><b>${sc}</b><button aria-label="Più" onclick="sc++;render()">+</button></div></div>
<h3>Ingredienti</h3><div class="card"><ul class="ing">${li}</ul></div>
<h3>Valori nutrizionali per persona</h3><div class="card"><div class="nut"><div class="k"><b>${fmt(n.k)}</b>kcal</div><div><b>${fmt(n.p)} g</b>proteine</div><div><b>${fmt(n.c)} g</b>carboidrati</div><div><b>${fmt(n.f)} g</b>grassi</div></div>${miss?'<p class="warn">Per alcuni ingredienti mancano valori o peso: il calcolo è incompleto.</p>':""}</div>
<h3>Procedimento</h3><ol class="st">${r.steps.map(s=>`<li>${esc(s.t)}${s.m?` <span class="mute">(${s.m} min)</span>`:""}</li>`).join("")}</ol>
<div class="row" style="margin-top:20px"><button class="p" onclick="cs=0;go('cook')">Cucina passo passo</button>${can()?`<button onclick="editR()">Modifica</button><button class="d" onclick="delR()">Elimina</button>`:""}</div>`}
function vCook(){const r=R.find(x=>x.id===cur);if(!r.steps.length)return go("view");const s=r.steps[cs],f=sc/r.servings;
const il=cs===0?`<div class="card"><b>Prepara per ${sc} persone</b><ul class="ing">${r.ings.map(i=>`<li><span>${esc(i.n)}</span><b>${fmt(i.q*f)} ${i.u}</b></li>`).join("")}</ul></div>`:"";
$("#app").innerHTML=`<div class="cook"><div><div class="row sp"><span class="mute">Passo ${cs+1} di ${r.steps.length}</span><button class="l" onclick="go('view')">Esci</button></div><div class="bar"><i style="width:${(cs+1)/r.steps.length*100}%"></i></div><p class="big">${esc(s.t)}</p>${il}
${s.m?`<div class="card row sp"><span class="tm" id="tv">${tf(tm.id?tm.left:s.m*60)}</span><button id="tb" onclick="tgl(${s.m*60})">${tm.id?"Ferma":"Avvia timer"}</button></div>`:""}</div>
<div class="row sp"><button ${cs?"":"disabled"} onclick="stp(-1)">Indietro</button>${cs<r.steps.length-1?`<button class="p" onclick="stp(1)">Avanti</button>`:`<button class="p" onclick="go('view')">Fatto, buon appetito</button>`}</div></div>`}
const tf=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function stp(d){cs+=d;clearInterval(tm.id);tm={id:null,left:0};render()}
function tgl(total){if(tm.id){clearInterval(tm.id);tm={id:null,left:0};return render()}tm.left=total;tm.id=setInterval(()=>{tm.left--;const e=$("#tv");if(e)e.textContent=tf(Math.max(0,tm.left));if(tm.left<=0){clearInterval(tm.id);tm.id=null;if(e)e.textContent="Tempo scaduto!";const b=$("#tb");if(b)b.textContent="Avvia timer";try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}}},1000);render()}
/* ---------- modifica ---------- */
const blank=()=>({n:"",q:0,u:"g",k:0,p:0,c:0,f:0,pc:0});
function newR(){draft={name:"",cat:"Primo",servings:4,ings:[blank()],steps:[{t:"",m:0}],isNew:true};go("edit")}
function editR(){draft=JSON.parse(JSON.stringify(R.find(x=>x.id===cur)));go("edit")}
async function delR(){if(!confirm("Eliminare questa ricetta?"))return;const{error}=await sb.from("recipes").delete().eq("id",cur);if(error)return fail(error);if(await loadRecipes())go("list")}
function vEdit(){const d=draft;$("#app").innerHTML=`<h2>${d.isNew?"Nuova ricetta":"Modifica ricetta"}</h2>
<p class="fl">Nome</p><input value="${esc(d.name)}" oninput="draft.name=this.value" placeholder="Es. Lasagne">
<p class="fl">Portata</p><select onchange="draft.cat=this.value">${PORT.map(c=>`<option ${c===d.cat?"selected":""}>${c}</option>`).join("")}</select>
<p class="fl">Porzioni della ricetta</p><input type="number" min="1" value="${d.servings}" oninput="draft.servings=+this.value||1">
<h3>Ingredienti</h3>${d.ings.map((i,x)=>`<div class="er"><div class="g g3"><input list="dl" value="${esc(i.n)}" placeholder="Ingrediente" onchange="pick(${x},this.value)"><input type="number" step="any" value="${i.q||""}" placeholder="Quantità" oninput="draft.ings[${x}].q=+this.value">
<select onchange="draft.ings[${x}].u=this.value">${["g","ml","cucchiaio","cucchiaino","pezzo"].map(u=>`<option ${u===i.u?"selected":""}>${u}</option>`).join("")}</select><button class="d" aria-label="Rimuovi" onclick="draft.ings.splice(${x},1);render()">✕</button></div>
<p class="fl" style="margin:8px 0 2px">Valori per 100 g (si compilano da soli)</p><div class="g g5">${[["k","kcal"],["p","prot."],["c","carb."],["f","grassi"],["pc","g/pezzo"]].map(([k,l])=>`<div><label>${l}</label><input type="number" step="any" id="f${x}${k}" value="${i[k]||0}" oninput="draft.ings[${x}].${k}=+this.value"></div>`).join("")}</div><div id="st${x}" class="mute"></div></div>`).join("")}
<button onclick="draft.ings.push(blank());render()">Aggiungi ingrediente</button>
<h3>Procedimento</h3>${d.steps.map((s,x)=>`<div class="er"><textarea rows="2" placeholder="Descrivi il passaggio" oninput="draft.steps[${x}].t=this.value">${esc(s.t)}</textarea><div class="row sp" style="margin-top:6px"><span class="row"><span class="fl">Timer (minuti)</span><input style="width:80px" type="number" min="0" value="${s.m}" oninput="draft.steps[${x}].m=+this.value||0"></span><button class="d" onclick="draft.steps.splice(${x},1);render()">Rimuovi</button></div></div>`).join("")}
<button onclick="draft.steps.push({t:'',m:0});render()">Aggiungi passaggio</button>
<div class="row" style="margin-top:22px"><button class="p" onclick="saveR()">Salva ricetta</button><button onclick="go(draft.isNew?'list':'view')">Annulla</button></div>`}
function fillF(x,d){const i=draft.ings[x];[i.k,i.p,i.c,i.f,i.pc]=d;["k","p","c","f","pc"].forEach(k=>{const e=$("#f"+x+k);if(e)e.value=i[k]})}
async function pick(x,v){const i=draft.ings[x];i.n=v.trim();if(!i.n)return;const d=LK(i.n),s=()=>$("#st"+x);
if(d){fillF(x,d);if(s())s().textContent="";return}
if(s())s().textContent="Cerco su Open Food Facts…";
try{const r=await(await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=12&lc=it&fields=product_name,brands,nutriments&search_terms="+encodeURIComponent(i.n))).json();
OFF[x]=(r.products||[]).filter(p=>p.product_name&&p.nutriments&&p.nutriments["energy-kcal_100g"]!=null).slice(0,6).map(p=>({t:p.product_name+(p.brands?" ("+p.brands.split(",")[0]+")":""),a:["energy-kcal_100g","proteins_100g","carbohydrates_100g","fat_100g"].map(k=>Math.round((+p.nutriments[k]||0)*10)/10).concat([0])}));
if(s())s().innerHTML=OFF[x].length?`<span class="fl">Scegli il più simile (sono prodotti confezionati, controlla i numeri):</span>`+OFF[x].map((o,y)=>`<button class="l" style="display:block;text-align:left" onclick="useOff(${x},${y})">${esc(o.t)}: ${o.a[0]} kcal</button>`).join(""):"Nessun risultato: inserisci i valori a mano."}
catch(e){if(s())s().textContent="Ricerca non riuscita: inserisci i valori a mano."}}
function useOff(x,y){fillF(x,OFF[x][y].a);$("#st"+x).textContent="Valori applicati. Verranno ricordati per questo ricettario."}
async function saveR(){const d=draft;if(!d.name.trim())return msg("Dai un nome alla ricetta.");
d.ings=d.ings.filter(i=>i.n.trim());d.steps=d.steps.filter(s=>s.t.trim());msg("Salvo…",1);
const row={cookbook_id:C.id,name:d.name.trim(),category:d.cat,servings:d.servings};let id=d.id;
if(d.isNew){const{data,error}=await sb.from("recipes").insert(row).select("id").single();if(error)return fail(error);id=data.id}
else{const{error}=await sb.from("recipes").update(row).eq("id",id);if(error)return fail(error);
await sb.from("recipe_ingredients").delete().eq("recipe_id",id);await sb.from("recipe_steps").delete().eq("recipe_id",id)}
if(d.ings.length){const{error}=await sb.from("recipe_ingredients").insert(d.ings.map((i,x)=>({recipe_id:id,position:x,name:i.n,quantity:i.q,unit:i.u,kcal:i.k,protein:i.p,carbs:i.c,fat:i.f,piece_grams:i.pc})));if(error)return fail(error)}
if(d.steps.length){const{error}=await sb.from("recipe_steps").insert(d.steps.map((s,x)=>({recipe_id:id,position:x,body:s.t,minutes:s.m})));if(error)return fail(error)}
const nk=d.ings.filter(i=>!LK(i.n)&&(i.k||i.p||i.c||i.f)).map(i=>({cookbook_id:C.id,name:i.n.toLowerCase(),kcal:i.k,protein:i.p,carbs:i.c,fat:i.f,piece_grams:i.pc}));
if(nk.length)await sb.from("known_ingredients").upsert(nk,{onConflict:"cookbook_id,name"});
if(await loadRecipes())go("view",id)}
init();
</script>
